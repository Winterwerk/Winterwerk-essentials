<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winterwerk Essentials | Drop 01</title>
    
    <!-- Edle Schriftarten von Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* Basis-Design (Dark Mode) */
        :root {
            --bg-color: #050505;
            --text-light: #f3f3f3;
            --text-dim: #a1a1aa;
            --amber-glow: rgba(255, 170, 50, 0.6);
            --amber-bright: #ffaa32;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Hintergrund-Leuchten (wird von der Flamme geworfen) */
        .ambient-light {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--amber-glow) 0%, transparent 60%);
            opacity: 0.15;
            z-index: 0;
            animation: ambient-flicker 3s infinite alternate;
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
        }

        /* Branding */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin: 0 0 2rem 0;
            color: var(--text-dim);
        }

        /* Der Timer */
        .timer {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #fff;
            text-shadow: 0 10px 30px var(--amber-glow);
            animation: text-flicker 3s infinite alternate;
        }

        .timer-labels {
            display: flex;
            justify-content: center;
            gap: 2.8rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--amber-bright);
            margin-top: -10px;
        }

        /* Die CSS-Kerze */
        .candle-container {
            position: relative;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            margin: 2rem 0;
        }

        .flame {
            width: 15px;
            height: 35px;
            background: radial-gradient(ellipse at bottom, #ffffff 10%, #ffaa32 50%, transparent 100%);
            border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
            box-shadow: 0 0 20px 5px var(--amber-glow);
            animation: flame-flicker 0.1s infinite alternate;
            margin-bottom: 2px;
        }

        .wick {
            width: 2px;
            height: 10px;
            background: #111;
            border-radius: 2px;
        }

        .wax {
            width: 60px;
            height: 60px;
            background: linear-gradient(to bottom, #2a2a2a, #111111);
            border-radius: 3px 3px 10px 10px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .wax::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: rgba(255, 170, 50, 0.2);
            border-radius: 50%;
        }

        /* Formular Bereich */
        .form-section {
            width: 100%;
        }

        .form-section p {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="email"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="email"]:focus {
            border-color: var(--amber-bright);
            background: rgba(255, 255, 255, 0.08);
        }

        button {
            width: 100%;
            padding: 15px 20px;
            background: var(--text-light);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--amber-bright);
            box-shadow: 0 0 15px rgba(255, 170, 50, 0.4);
        }

        /* Animationen */
        @keyframes flame-flicker {
            0% { transform: scale(1) rotate(-1deg); opacity: 0.9; }
            100% { transform: scale(1.05) rotate(1deg); opacity: 1; }
        }

        @keyframes ambient-flicker {
            0% { opacity: 0.12; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 0.18; transform: translate(-50%, -50%) scale(1.05); }
        }

        @keyframes text-flicker {
            0% { text-shadow: 0 5px 20px rgba(255, 170, 50, 0.4); }
            100% { text-shadow: 0 10px 30px rgba(255, 170, 50, 0.7); }
        }

        /* Mobile Anpassung */
        @media (max-width: 600px) {
            .timer { font-size: 3rem; }
            .timer-labels { gap: 1.8rem; font-size: 0.6rem; }
            .ambient-light { width: 400px; height: 400px; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <div class="content-wrapper">
        <header>
            <h1>Winterwerk</h1>
        </header>

        <div>
            <div id="countdown" class="timer">00:00:00:00</div>
            <div class="timer-labels">
                <span>Tage</span>
                <span>Std</span>
                <span>Min</span>
                <span>Sek</span>
            </div>
        </div>

        <div class="candle-container">
            <div class="flame"></div>
            <div class="wick"></div>
            <div class="wax"></div>
        </div>

        <div class="form-section">
            <p>Drop 01. The Aesthetic Collection.<br>Streng limitiert auf 50 Unikate.</p>
            
            <!-- Ersetzen Sie "DEINE_FORMSPREE_ID" durch Ihren Formspree Link -->
            <form action="https://formspree.io/f/DEINE_FORMSPREE_ID" method="POST" class="form-group">
                <input type="email" name="email" placeholder="Deine E-Mail Adresse" required>
                <button type="submit">VIP-Zugang sichern</button>
            </form>
        </div>
    </div>

    <script>
        // Ziel-Datum: 1. Oktober 2026, 10:00:00 Uhr
        const targetDate = new Date('October 1, 2026 10:00:00').getTime();

        const countdownElement = document.getElementById('countdown');

        function updateCountdown() {
            const now = new Date().getTime();
            const timeRemaining = targetDate - now;

            if (timeRemaining <= 0) {
                countdownElement.innerHTML = "00:00:00:00";
                return;
            }

            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

            // Führende Nullen hinzufügen
            const formatTime = (time) => time < 10 ? `0${time}` : time;

            countdownElement.innerHTML = `${formatTime(days)}:${formatTime(hours)}:${formatTime(minutes)}:${formatTime(seconds)}`;
        }

        // Timer jede Sekunde aktualisieren
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
